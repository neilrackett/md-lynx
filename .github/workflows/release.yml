name: Release

# Rolling release: build with make, tag the version, move the
# lightweight "latest" tag to this commit, and replace the binaries on
# the existing "latest" release. The release's title and body are left
# exactly as they are: gh release upload touches assets only.

on:
  # Anything landing on main is a release: a merge, or a direct push,
  # unless all it changes is in paths-ignore (run it by hand to release
  # one of those anyway). Tag pushes do not match a branch filter, so the
  # tags this workflow pushes cannot trigger it again.
  push:
    branches:
      - main
    # Documentation and the EmuMD host build (emu/, including the
    # submodule, and mdfw.ini) are not part of the firmware, so a change
    # to nothing else does not need building. Keep this list the same in
    # pr.yml and release.yml.
    paths-ignore:
      - '**.md'
      - 'emu/**'
      - 'mdfw.ini'
  workflow_dispatch:

permissions:
  contents: write

# Two merges in quick succession would otherwise race: both force-move
# the latest tag and clobber the same two assets, and the loser decides
# what the release ends up holding. Newest commit wins instead.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    # The push trigger already filters to main; this is what stops a
    # manual dispatch from some other branch tagging and releasing it.
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Check the APP_UUID_KEY secret is set
      # Without it, make would quietly fall back to the sample UUID and
      # release under the wrong name. Fail here, before the toolchains.
      env:
        APP_UUID_KEY: ${{ secrets.APP_UUID_KEY }}
      run: test -n "$APP_UUID_KEY" || { echo "The APP_UUID_KEY secret is not set."; exit 1; }

    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Fetch the xpad submodule
      # The m68k build includes xpad/src/xpad.inc, and it runs before
      # rp/build.sh (which inits submodules itself), so xpad has to be
      # brought in here. Only xpad, deliberately: checkout's own
      # `submodules: true` clones every submodule at depth 1, and a
      # shallow pico-sdk has no tags for rp/build.sh to pin to.
      run: git submodule update --init lib/xpad

    - name: Set up Python
      # target/atarist/build.sh runs a bare "python", which ubuntu-latest
      # does not have; setup-python puts one on PATH. Stdlib only.
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install the Pico Toolchain
      # The runner image ships Google's Chrome apt source, which has
      # served mismatched index files and failed `apt update` outright.
      # Nothing here needs it.
      run: |
          sudo grep -l dl.google.com /etc/apt/sources.list.d/* | xargs -r sudo rm -f
          sudo DEBIAN_FRONTEND=noninteractive apt update || true
          sudo DEBIAN_FRONTEND=noninteractive apt install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential libstdc++-arm-none-eabi-newlib

    - name: Install AtariST Toolkit Docker image
      # Track the latest installer, not v1.0.0. The stcmd that v1.0.0
      # generates takes the Docker image tag from the ambient $VERSION,
      # and build.sh exports VERSION from version.txt, so CI went looking
      # for an image tagged with the app's own version and every release
      # run died with "manifest unknown". Newer installers read
      # STCMD_IMAGE_TAG instead, so there is nothing left to collide, and
      # they honour STCMD_NO_TTY (which build.sh already sets on every
      # call) rather than needing the -it flag sed'd out of the wrapper.
      # The image tag was never pinned in either case: both installers
      # default to :latest.
      run: curl -sL https://github.com/sidecartridge/atarist-toolkit-docker/releases/latest/download/install_atarist_toolkit_docker.sh | bash

    - name: Build
      # The Makefile skips the version bump, so this builds exactly what
      # the tree says. The app UUID comes from the APP_UUID_KEY secret;
      # uuid.txt is deliberately not committed.
      env:
        APP_UUID_KEY: ${{ secrets.APP_UUID_KEY }}
      run: make

    - name: Tag the version and move latest
      run: |
        VERSION=$(tr -d '\r\n' < version.txt)
        if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
          echo "Tag $VERSION already exists; leaving it where it is."
        else
          git tag "$VERSION"
        fi
        git tag -f latest
        git push origin "refs/tags/$VERSION" +refs/tags/latest

    - name: Replace the binaries on the latest release
      env:
        GH_TOKEN: ${{ github.token }}
        UUID: ${{ secrets.APP_UUID_KEY }}
      run: |
        VERSION=$(tr -d '\r\n' < version.txt)
        cp "dist/$UUID-$VERSION.uf2" "dist/$UUID.uf2"
        gh release upload latest "dist/$UUID.uf2" "dist/$UUID.json" --clobber
