; mdfw.ini - MD/Lynx built for EmuMD (mdfw build), to run in Hatari.
; https://github.com/neilrackett/emumd; paths are relative to this file.

[firmware]
name = MD/Lynx
output = build/md-lynx.mdfw
; Built on the SidecarTridge microfirmware template: its own main() runs,
; with EmuMD standing in for the template's hardware (romemul.c,
; commemul.c, select.c, hw_config.c and sdcard.c are left out) and the
; Booster. The version comes from version.txt; the UUID is
; rp/src/CMakeLists.txt's default.
template = sidecartridge
uuid = 44444444-4444-4444-8444-444444444444

[sources]
; The firmware and the Handy core, as rp/src/CMakeLists.txt lists them.
; fb_chunked.c is left out for emu/'s version, and the two .S files are
; not built: emu/ has C versions of what they provide.
files =
    emu/*.c
    rp/src/*.c
    rp/src/*.cpp
    rp/src/lynx/*.cpp
    rp/src/settings/settings.c
exclude =
    rp/src/fb_chunked.c

[compile]
shims =
    emu/shim
include =
    rp/src/ff
    rp/src
    rp/src/include
    rp/src/settings
    rp
    lib/xpad/src
defines =
; emu/shim/mdlynx_emu.h goes first everywhere: see there for why.
cflags = -O2 -include mdlynx_emu.h
cxxflags = -fno-exceptions -fno-rtti

[run]
; The microSD card: cartridges go in emu/sd/lynx (README.md, "Running it
; on your computer"). Give a TOS image with --tos, or make emu TOS=...
machine = ste
sd = emu/sd
